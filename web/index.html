  <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
  
  <script>
    var currentCaptchaToken = null;
    
    function onCaptchaSuccess(token) {
      currentCaptchaToken = token;
    }
    
    function onCaptchaExpired() {
      currentCaptchaToken = null;
    }

    // 🌟 2. NEW: A function Flutter can call to force the render
    function forceRenderCaptcha(containerId, siteKey) {
      // We use a slight timeout to ensure Flutter has finished attaching the Div to the screen
      setTimeout(function() {
        if (window.grecaptcha) {
          window.grecaptcha.render(containerId, {
            'sitekey': siteKey,
            'callback': 'onCaptchaSuccess',
            'expired-callback': 'onCaptchaExpired'
          });
        }
      }, 300);
    }
  </script>
