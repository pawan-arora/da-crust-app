# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - prod
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 🌟 ADDED: Install Flutter on the GitHub server
      # 🌟 Pinned to the exact version used for local development/testing.
      # This was previously floating on channel: 'stable', which silently
      # installed whatever Flutter release was newest at build time — that
      # meant production could be running a different engine/CanvasKit
      # build than what was ever tested locally, with no way to notice.
      # Bump this deliberately (and re-test) when you want to upgrade.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          
      - name: Create config file
        run: |
          mkdir -p assets
          echo "${{ secrets.ENV_FILE }}" > assets/config.env
          
      # 🚨 THE MISSING STEP: You must build the web app before Firebase can upload it!
      - run: flutter pub get && flutter build web --dart-define=ENV=prod
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DA_CRUST_PROD }}
          channelId: live
          projectId: da-crust-prod