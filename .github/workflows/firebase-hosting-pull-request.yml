name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 🌟 ADDED: Install Flutter on the GitHub server
      # 🌟 Pinned to match the version used for local development/testing
      # and the production deploy workflow — see firebase-hosting-merge.yml
      # for why floating on channel: 'stable' was a problem.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Create config file
        run: |
          mkdir -p assets
          echo "${{ secrets.ENV_FILE }}" > assets/config.env
          
      - run: flutter pub get && flutter build web --dart-define=ENV=prod
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DA_CRUST_PROD }}
          projectId: da-crust-prod